<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHub – Ticket Booking</title>
  <!-- This one line loads ALL of Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-6">
      <nav class="flex items-center justify-between py-4">

        <!-- Logo -->
        <a href="#" class="flex items-center gap-2 font-extrabold text-xl text-slate-800">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-violet-500 to-pink-500 flex items-center justify-center text-white font-black text-sm">
            EH
          </div>
          Event<span class="text-violet-500">Hub</span>
        </a>

        <!-- Desktop Nav Links -->
        <ul class="hidden md:flex items-center gap-8">
          <li><a href="#events" class="text-slate-500 hover:text-violet-500 font-medium transition-colors duration-200">Events</a></li>
          <li><a href="#booking" class="text-slate-500 hover:text-violet-500 font-medium transition-colors duration-200">Book Tickets</a></li>
          <li><a href="#contact" class="text-slate-500 hover:text-violet-500 font-medium transition-colors duration-200">Contact</a></li>
        </ul>

        <!-- CTA Button -->
        <a href="#booking" class="bg-violet-500 hover:bg-violet-600 text-white font-semibold px-5 py-2 rounded-lg transition-colors duration-200">
